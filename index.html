<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chennus' maze generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #333; }
    .controls {
      margin-bottom: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      margin: 5px;
    }
    button:hover { background-color: #0056b3; }
    canvas {
      border: 4px solid #333;
      background-color: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <h1>chennus' maze generator</h1>
  <div class="controls">
    <button onclick="generateMaze()">Generate New Maze</button>
    <button onclick="downloadMaze()">Download PNG</button>
  </div>

  <canvas id="mazeCanvas" width="400" height="400"></canvas>

  <script>
    const canvas = document.getElementById('mazeCanvas');
    const ctx = canvas.getContext('2d');
    const cols = 15;
    const rows = 15;
    const cellSize = canvas.width / cols;
    let grid = [];

    class Cell {
      constructor(r, c) {
        this.r = r;
        this.c = c;
        this.walls = [true, true, true, true]; // Top, Right, Bottom, Left
        this.visited = false;
      }

      draw() {
        let x = this.c * cellSize;
        let y = this.r * cellSize;
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;

        if (this.walls[0]) drawLine(x, y, x + cellSize, y);
        if (this.walls[1]) drawLine(x + cellSize, y, x + cellSize, y + cellSize);
        if (this.walls[2]) drawLine(x + cellSize, y + cellSize, x, y + cellSize);
        if (this.walls[3]) drawLine(x, y + cellSize, x, y);
      }
    }

    function drawLine(x1, y1, x2, y2) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    function setupGrid() {
      grid = [];
      for (let r = 0; r < rows; r++) {
        let row = [];
        for (let c = 0; c < cols; c++) {
          row.push(new Cell(r, c));
        }
        grid.push(row);
      }
    }

    function generateMaze() {
      setupGrid();
      let stack = [];
      let current = grid[0][0];
      current.visited = true;

      while (true) {
        let next = getUnvisitedNeighbor(current);
        if (next) {
          next.visited = true;
          stack.push(current);
          removeWalls(current, next);
          current = next;
        } else if (stack.length > 0) {
          current = stack.pop();
        } else {
          break;
        }
      }

      // Open Start (Top-Left) and End (Bottom-Right)
      grid[0][0].walls[3] = false;
      grid[rows - 1][cols - 1].walls[1] = false;

      // Draw to Canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          grid[r][c].draw();
        }
      }
    }

    function getUnvisitedNeighbor(cell) {
      let neighbors = [];
      let { r, c } = cell;

      if (r > 0 && !grid[r - 1][c].visited) neighbors.push(grid[r - 1][c]);
      if (c < cols - 1 && !grid[r][c + 1].visited) neighbors.push(grid[r][c + 1]);
      if (r < rows - 1 && !grid[r + 1][c].visited) neighbors.push(grid[r + 1][c]);
      if (c > 0 && !grid[r][c - 1].visited) neighbors.push(grid[r][c - 1]);

      if (neighbors.length > 0) {
        let randomIndex = Math.floor(Math.random() * neighbors.length);
        return neighbors[randomIndex];
      }
      return undefined;
    }

    function removeWalls(a, b) {
      let x = a.c - b.c;
      if (x === 1) { a.walls[3] = false; b.walls[1] = false; }
      else if (x === -1) { a.walls[1] = false; b.walls[3] = false; }

      let y = a.r - b.r;
      if (y === 1) { a.walls[0] = false; b.walls[2] = false; }
      else if (y === -1) { a.walls[2] = false; b.walls[0] = false; }
    }

    function downloadMaze() {
      let link = document.createElement('a');
      link.download = 'chennus-maze.png';
      link.href = canvas.toDataURL();
      link.click();
    }

    generateMaze();
  </script>
</body>
</html>
